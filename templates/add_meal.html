{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Add a Meal</h2>

    <!-- Ingredient Search -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Search Ingredient Database</h5>
            <div class="input-group">
                <input type="text" class="form-control" id="ingredient-search" placeholder="Search for ingredient">
                <button class="btn btn-outline-primary" id="ingredient-search-btn" type="button">Search</button>
            </div>
            <!-- Search Results -->
            <ul class="list-group mt-2" id="ingredient-results"></ul>
        </div>
    </div>

    <!-- Selected Ingredients List -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Selected Ingredients</h5>
            <ul class="list-group" id="selected-ingredients-list">
                <li class="list-group-item text-muted">
                    No ingredients added yet
                </li>
            </ul>
        </div>
    </div>

    <!-- Form to add a meal -->
    <form action="{{ url_for('meal.add_meal') }}" method="POST">
        <input type="hidden" name="ingredient_ids" id="ingredient-ids">

        <!-- Meal Name -->
        <div class="form-group">
            <label for="name">Meal Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter meal name" required>
        </div>

        <!-- Meal Description -->
        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea class="form-control" id="description" name="description" placeholder="Enter description"></textarea>
        </div>

        <!-- Macros -->
        <div class="form-group">
            <label for="calories">Calories</label>
            <input type="number" step="0.1" class="form-control" id="calories" name="calories" placeholder="0" required>
        </div>
        <div class="form-group">
            <label for="protein">Protein (g)</label>
            <input type="number" step="0.1" class="form-control" id="protein" name="protein" placeholder="0" required>
        </div>
        <div class="form-group">
            <label for="fat">Fat (g)</label>
            <input type="number" step="0.1" class="form-control" id="fat" name="fat" placeholder="0" required>
        </div>
        <div class="form-group">
            <label for="carbs">Carbs (g)</label>
            <input type="number" step="0.1" class="form-control" id="carbs" name="carbs" placeholder="0" required>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary">Add Meal</button>
        <a href="{{ url_for('meal.my_meals') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<!-- JS -->
<script src="{{ url_for('static', filename='js/add_meal.js') }}"></script>
{% endblock %}
